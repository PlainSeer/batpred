name: freeze-discharge-rate-pr
on:
  pull_request:
    branches: [main, validation-base-v8.49.2]
permissions:
  contents: write
jobs:
  patch-build-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Extract and apply patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/freeze-discharge-rate-sync.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end]) + '\n'
          Path('/tmp/apply_freeze_discharge_rate.py').write_text(script)
          PY
          python3 /tmp/apply_freeze_discharge_rate.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cross-build all prediction kernels
        run: bash apps/predbat/build_kernel_cross.sh
      - name: Run focused model and kernel parity tests
        env:
          PREDBAT_KERNEL_REQUIRED: "1"
        run: |
          cd coverage
          python3 ../apps/predbat/unit_test.py --test model --test kernel_parity
      - name: Run quick test suite
        env:
          PREDBAT_KERNEL_REQUIRED: "1"
        run: |
          cd coverage
          python3 ../apps/predbat/unit_test.py --quick
      - name: Verify checked-in x86_64 kernel
        run: |
          cd coverage
          python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so
      - name: Commit validated patch and rebuilt kernels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/predbat/predbat.py apps/predbat/prediction.py apps/predbat/prediction_kernel.cpp apps/predbat/prediction_kernel.py apps/predbat/prediction_kernel_lib_*.so apps/predbat/tests/test_infra.py apps/predbat/tests/test_model.py apps/predbat/tests/test_kernel_parity.py
          git commit -m "feat: model Freeze Export battery discharge rate"
          git push origin HEAD:${{ github.head_ref }}
