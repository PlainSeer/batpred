name: Freeze export loss patch

on:
  push:
    branches:
      - freeze-export-loss-240

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeze-export-loss-240
          fetch-depth: 0
      - name: Apply freeze export loss model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\nANCHOR:\n{old}")
              p.write_text(text.replace(old, new, 1))

          # Base configuration: apps.yaml-only setting in watts; zero preserves upstream behaviour.
          replace_once(
              "apps/predbat/predbat.py",
              "        self.inverter_loss = 1.0\n        self.inverter_hybrid = True\n",
              "        self.inverter_loss = 1.0\n        # Internal battery energy loss (W) seen while Freeze Export is active.\n        # This is a prediction-only model and does not change inverter control.\n        self.inverter_freeze_export_loss = max(float(self.args.get(\"inverter_freeze_export_loss\", 0)), 0.0)\n        self.inverter_hybrid = True\n",
          )

          # Python prediction engine.
          replace_once(
              "apps/predbat/prediction.py",
              "            self.inverter_loss = base.inverter_loss\n            self.inverter_hybrid = base.inverter_hybrid\n",
              "            self.inverter_loss = base.inverter_loss\n            self.inverter_freeze_export_loss = base.inverter_freeze_export_loss\n            self.inverter_hybrid = base.inverter_hybrid\n",
          )
          replace_once(
              "apps/predbat/prediction.py",
              "        battery_rate_max_export = self.battery_rate_max_export\n        battery_rate_min = self.battery_rate_min\n        carbon_intensity = self.carbon_intensity\n",
              "        battery_rate_max_export = self.battery_rate_max_export\n        battery_rate_min = self.battery_rate_min\n        inverter_freeze_export_loss = self.inverter_freeze_export_loss\n        carbon_intensity = self.carbon_intensity\n",
          )
          replace_once(
              "apps/predbat/prediction.py",
              "            export_window_active = export_window_n >= 0\n            export_limit_now = export_limits[export_window_n] if export_window_active else 100.0\n\n            # Find charge limit\n",
              "            export_window_active = export_window_n >= 0\n            export_limit_now = export_limits[export_window_n] if export_window_active else 100.0\n            freeze_export_active = set_export_freeze and export_window_active and export_limit_now < 100.0 and (export_limit_now == 99.0 or set_export_freeze_only)\n\n            # Find charge limit\n",
          )
          replace_once(
              "apps/predbat/prediction.py",
              "            # discharge freeze, reset charge rate by default\n            if set_export_freeze:\n                # Freeze mode\n                if (export_window_active) and export_limit_now < 100.0 and (set_export_freeze and (export_limit_now == 99.0 or set_export_freeze_only)):\n                    charge_rate_now = battery_rate_min  # 0\n",
              "            # discharge freeze, reset charge rate by default\n            if freeze_export_active:\n                charge_rate_now = battery_rate_min  # 0\n",
          )
          replace_once(
              "apps/predbat/prediction.py",
              "                        # Freeze mode\n                        if set_export_freeze and export_window_active and export_limit_now < 100.0 and (export_limit_now == 99.0 or set_export_freeze_only):\n                            charge_rate_now_dc = battery_rate_min  # 0\n",
              "                        # Freeze mode\n                        if freeze_export_active:\n                            charge_rate_now_dc = battery_rate_min  # 0\n",
          )
          replace_once(
              "apps/predbat/prediction.py",
              "            # Adjust battery soc\n            if battery_draw > 0:\n                soc = max(soc - battery_draw / battery_loss_discharge, reserve_expected)\n            else:\n                soc = min(soc - battery_draw * battery_loss, soc_max)\n\n            # Iboost finally count\n",
              "            # Adjust battery soc\n            if battery_draw > 0:\n                soc = max(soc - battery_draw / battery_loss_discharge, reserve_expected)\n            else:\n                soc = min(soc - battery_draw * battery_loss, soc_max)\n\n            # Some inverters still consume battery energy while Freeze Export blocks normal\n            # charge/discharge flow. Model that as an internal, directional battery loss rather\n            # than battery_draw so it reduces SoC without creating fictitious house/grid energy.\n            freeze_export_loss_step = 0.0\n            if freeze_export_active and inverter_freeze_export_loss > 0:\n                freeze_export_loss_step = min(inverter_freeze_export_loss * step / 60000.0, max(soc - reserve_expected, 0))\n                soc -= freeze_export_loss_step\n\n            # Iboost finally count\n",
          )
          replace_once(
              "apps/predbat/prediction.py",
              "            # Count battery cycles\n            battery_cycle = battery_cycle + abs(battery_draw)\n",
              "            # Count battery cycles, including any internal Freeze Export discharge loss\n            battery_cycle = battery_cycle + abs(battery_draw) + freeze_export_loss_step\n",
          )

          # ctypes marshalling layer. Context layout changed, and the behavioural revision changed.
          replace_once(
              "apps/predbat/prediction_kernel.py",
              "KERNEL_ABI_VERSION = 4\nKERNEL_PARITY_REVISION = 6\n",
              "KERNEL_ABI_VERSION = 5\nKERNEL_PARITY_REVISION = 7\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.py",
              "        (\"battery_rate_min\", ctypes.c_double),\n        (\"battery_rate_max_charge\", ctypes.c_double),\n",
              "        (\"battery_rate_min\", ctypes.c_double),\n        (\"inverter_freeze_export_loss\", ctypes.c_double),\n        (\"battery_rate_max_charge\", ctypes.c_double),\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.py",
              "        ctx.battery_rate_min = pred.battery_rate_min\n        ctx.battery_rate_max_charge = pred.battery_rate_max_charge\n",
              "        ctx.battery_rate_min = pred.battery_rate_min\n        ctx.inverter_freeze_export_loss = pred.inverter_freeze_export_loss\n        ctx.battery_rate_max_charge = pred.battery_rate_max_charge\n",
          )

          # C++ kernel mirror.
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "#define PK_ABI_VERSION 4\n#define PK_PARITY_REVISION 6\n",
              "#define PK_ABI_VERSION 5\n#define PK_PARITY_REVISION 7\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "    double battery_rate_min;\n    double battery_rate_max_charge;\n",
              "    double battery_rate_min;\n    double inverter_freeze_export_loss; // W, internal battery loss while Freeze Export is active\n    double battery_rate_max_charge;\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "    const double battery_rate_max_export = c->battery_rate_max_export;\n    const double battery_rate_min = c->battery_rate_min;\n",
              "    const double battery_rate_max_export = c->battery_rate_max_export;\n    const double battery_rate_min = c->battery_rate_min;\n    const double inverter_freeze_export_loss = c->inverter_freeze_export_loss;\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "        const bool export_window_active = export_window_n >= 0;\n        const double export_limit_now = export_window_active ? s->export_limits[export_window_n] : 100.0;\n\n        // Find charge limit",
              "        const bool export_window_active = export_window_n >= 0;\n        const double export_limit_now = export_window_active ? s->export_limits[export_window_n] : 100.0;\n        const bool freeze_export_active = c->set_export_freeze && export_window_active && export_limit_now < 100.0 && (export_limit_now == 99.0 || c->set_export_freeze_only);\n\n        // Find charge limit",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "        // Discharge freeze - prediction.py:764-768\n        if (c->set_export_freeze) {\n            if (export_window_active && export_limit_now < 100.0 && (c->set_export_freeze && (export_limit_now == 99.0 || c->set_export_freeze_only))) {\n                charge_rate_now = battery_rate_min; // 0\n            }\n        }\n",
              "        // Discharge freeze\n        if (freeze_export_active) {\n            charge_rate_now = battery_rate_min; // 0\n        }\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "                    // Freeze mode - prediction.py:973-975\n                    if (c->set_export_freeze && export_window_active && export_limit_now < 100.0 && (export_limit_now == 99.0 || c->set_export_freeze_only)) {\n                        charge_rate_now_dc = battery_rate_min; // 0\n                    }\n",
              "                    // Freeze mode\n                    if (freeze_export_active) {\n                        charge_rate_now_dc = battery_rate_min; // 0\n                    }\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "        // Adjust battery soc - prediction.py:1060-1064\n        if (battery_draw > 0) {\n            soc = std::max(soc - battery_draw / battery_loss_discharge, reserve_expected);\n        } else {\n            soc = std::min(soc - battery_draw * battery_loss, soc_max);\n        }\n",
              "        // Adjust battery soc\n        if (battery_draw > 0) {\n            soc = std::max(soc - battery_draw / battery_loss_discharge, reserve_expected);\n        } else {\n            soc = std::min(soc - battery_draw * battery_loss, soc_max);\n        }\n\n        // Internal, directional battery loss while Freeze Export is active. This mirrors\n        // prediction.py and deliberately does not alter battery_draw/grid energy.\n        double freeze_export_loss_step = 0.0;\n        if (freeze_export_active && inverter_freeze_export_loss > 0) {\n            freeze_export_loss_step = std::min(inverter_freeze_export_loss * step / 60000.0, std::max(soc - reserve_expected, 0.0));\n            soc -= freeze_export_loss_step;\n        }\n",
          )
          replace_once(
              "apps/predbat/prediction_kernel.cpp",
              "        // Count battery cycles - prediction.py:1094-1095\n        battery_cycle = battery_cycle + std::fabs(battery_draw);\n",
              "        // Count battery cycles, including any internal Freeze Export discharge loss\n        battery_cycle = battery_cycle + std::fabs(battery_draw) + freeze_export_loss_step;\n",
          )
          PY

      - name: Syntax and kernel build
        shell: bash
        run: |
          python3 -m py_compile apps/predbat/predbat.py apps/predbat/prediction.py apps/predbat/prediction_kernel.py
          bash apps/predbat/build_kernel.sh apps/predbat/prediction_kernel_lib_x86_64.so
          python3 apps/predbat/verify_kernel_binary.py apps/predbat/prediction_kernel_lib_x86_64.so

      - name: Kernel parity test
        shell: bash
        run: |
          if [ -x coverage/run_all ]; then
            (cd coverage && ./run_all --test kernel_parity)
          else
            echo "coverage/run_all not present; skipping full parity suite"
          fi

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/freeze-export-loss-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/predbat/predbat.py apps/predbat/prediction.py apps/predbat/prediction_kernel.py apps/predbat/prediction_kernel.cpp apps/predbat/prediction_kernel_lib_x86_64.so .github/workflows/freeze-export-loss-patch.yml
          git commit -m "feat(prediction): model configurable Freeze Export battery loss"
          git push origin HEAD:freeze-export-loss-240
