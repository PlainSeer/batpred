name: freeze-discharge-rate-sync
on:
  push:
    branches:
      - sync-v8.49.2-freeze-discharge-rate
permissions:
  contents: write
jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-v8.49.2-freeze-discharge-rate
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply Freeze Export discharge-rate model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Runtime configuration and diagnostic.
          replace(
              "apps/predbat/predbat.py",
              "        self.inverter_loss = 1.0\n        self.inverter_hybrid = True\n",
              "        self.inverter_loss = 1.0\n"
              "        # Internal battery discharge rate (W) observed while Freeze Export is active.\n"
              "        # Prediction-only: this does not alter inverter control or house/grid energy.\n"
              "        self.inverter_freeze_export_discharge_rate = max(float(self.args.get(\"inverter_freeze_export_discharge_rate\", 0)), 0.0)\n"
              "        self.log(\"Freeze Export discharge rate configured: {:.0f} W\".format(self.inverter_freeze_export_discharge_rate))\n"
              "        self.inverter_hybrid = True\n",
          )

          # Python prediction engine: carry the config into Prediction, apply it only while
          # a genuine Freeze Export window is active, respect reserve, and count the energy
          # as battery cycling without fabricating load/export energy.
          replace(
              "apps/predbat/prediction.py",
              "            self.inverter_loss = base.inverter_loss\n            self.inverter_hybrid = base.inverter_hybrid\n",
              "            self.inverter_loss = base.inverter_loss\n"
              "            self.inverter_freeze_export_discharge_rate = base.inverter_freeze_export_discharge_rate\n"
              "            self.inverter_hybrid = base.inverter_hybrid\n",
          )
          replace(
              "apps/predbat/prediction.py",
              "        battery_rate_max_export = self.battery_rate_max_export\n        battery_rate_min = self.battery_rate_min\n        carbon_intensity = self.carbon_intensity\n",
              "        battery_rate_max_export = self.battery_rate_max_export\n"
              "        battery_rate_min = self.battery_rate_min\n"
              "        inverter_freeze_export_discharge_rate = self.inverter_freeze_export_discharge_rate\n"
              "        carbon_intensity = self.carbon_intensity\n",
          )
          replace(
              "apps/predbat/prediction.py",
              "            export_limit_now = export_limits[export_window_n] if export_window_active else 100.0\n\n            # Find charge limit\n",
              "            export_limit_now = export_limits[export_window_n] if export_window_active else 100.0\n"
              "            freeze_export_active = set_export_freeze and export_window_active and export_limit_now < 100.0 and (export_limit_now == 99.0 or set_export_freeze_only)\n\n"
              "            # Find charge limit\n",
          )
          replace(
              "apps/predbat/prediction.py",
              "            else:\n                soc = min(soc - battery_draw * battery_loss, soc_max)\n\n            # Iboost finally count\n",
              "            else:\n"
              "                soc = min(soc - battery_draw * battery_loss, soc_max)\n\n"
              "            # Some inverters continue to discharge the battery internally while Freeze Export\n"
              "            # blocks normal external battery flow. Model that measured battery-side discharge\n"
              "            # directly in SoC without creating fictitious house load or grid energy.\n"
              "            freeze_export_discharge_step = 0.0\n"
              "            if freeze_export_active and inverter_freeze_export_discharge_rate > 0:\n"
              "                freeze_export_discharge_step = min(inverter_freeze_export_discharge_rate * step / 60000.0, max(soc - reserve_expected, 0))\n"
              "                soc -= freeze_export_discharge_step\n\n"
              "            # Iboost finally count\n",
          )
          replace(
              "apps/predbat/prediction.py",
              "            # Count battery cycles\n            battery_cycle = battery_cycle + abs(battery_draw)\n",
              "            # Count battery cycles, including internal Freeze Export battery discharge\n"
              "            battery_cycle = battery_cycle + abs(battery_draw) + freeze_export_discharge_step\n",
          )

          # Native prediction kernel ABI + matching model.
          replace(
              "apps/predbat/prediction_kernel.cpp",
              "#define PK_ABI_VERSION 4\n#define PK_PARITY_REVISION 7\n",
              "#define PK_ABI_VERSION 5\n#define PK_PARITY_REVISION 8\n",
          )
          replace(
              "apps/predbat/prediction_kernel.cpp",
              "    double inverter_loss;\n    double inverter_limit;",
              "    double inverter_loss;\n    double inverter_freeze_export_discharge_rate; // W, internal battery discharge while Freeze Export is active\n    double inverter_limit;",
          )
          replace(
              "apps/predbat/prediction_kernel.cpp",
              "    const double battery_rate_max_export = c->battery_rate_max_export;\n    const double battery_rate_min = c->battery_rate_min;\n",
              "    const double battery_rate_max_export = c->battery_rate_max_export;\n"
              "    const double battery_rate_min = c->battery_rate_min;\n"
              "    const double inverter_freeze_export_discharge_rate = c->inverter_freeze_export_discharge_rate;\n",
          )
          replace(
              "apps/predbat/prediction_kernel.cpp",
              "        const double export_limit_now = export_window_active ? s->export_limits[export_window_n] : 100.0;\n\n        // Find charge limit",
              "        const double export_limit_now = export_window_active ? s->export_limits[export_window_n] : 100.0;\n"
              "        const bool freeze_export_active = c->set_export_freeze && export_window_active && export_limit_now < 100.0 && (export_limit_now == 99.0 || c->set_export_freeze_only);\n\n"
              "        // Find charge limit",
          )
          replace(
              "apps/predbat/prediction_kernel.cpp",
              "        } else {\n            soc = std::min(soc - battery_draw * battery_loss, soc_max);\n        }\n\n        // iBoost final count",
              "        } else {\n"
              "            soc = std::min(soc - battery_draw * battery_loss, soc_max);\n"
              "        }\n\n"
              "        // Internal, directional battery discharge while Freeze Export is active.\n"
              "        // This mirrors prediction.py and deliberately does not alter battery_draw/grid energy.\n"
              "        double freeze_export_discharge_step = 0.0;\n"
              "        if (freeze_export_active && inverter_freeze_export_discharge_rate > 0) {\n"
              "            freeze_export_discharge_step = std::min(inverter_freeze_export_discharge_rate * step / 60000.0, std::max(soc - reserve_expected, 0.0));\n"
              "            soc -= freeze_export_discharge_step;\n"
              "        }\n\n"
              "        // iBoost final count",
          )
          replace(
              "apps/predbat/prediction_kernel.cpp",
              "        battery_cycle = battery_cycle + std::fabs(battery_draw);\n",
              "        battery_cycle = battery_cycle + std::fabs(battery_draw) + freeze_export_discharge_step;\n",
          )

          replace(
              "apps/predbat/prediction_kernel.py",
              "KERNEL_ABI_VERSION = 4\nKERNEL_PARITY_REVISION = 7\n",
              "KERNEL_ABI_VERSION = 5\nKERNEL_PARITY_REVISION = 8\n",
          )
          replace(
              "apps/predbat/prediction_kernel.py",
              "        (\"inverter_loss\", ctypes.c_double),\n        (\"inverter_limit\", ctypes.c_double),\n",
              "        (\"inverter_loss\", ctypes.c_double),\n"
              "        (\"inverter_freeze_export_discharge_rate\", ctypes.c_double),\n"
              "        (\"inverter_limit\", ctypes.c_double),\n",
          )
          replace(
              "apps/predbat/prediction_kernel.py",
              "        ctx.inverter_loss = pred.inverter_loss\n        ctx.inverter_limit = pred.inverter_limit\n",
              "        ctx.inverter_loss = pred.inverter_loss\n"
              "        ctx.inverter_freeze_export_discharge_rate = pred.inverter_freeze_export_discharge_rate\n"
              "        ctx.inverter_limit = pred.inverter_limit\n",
          )

          # Focused model regression coverage (Python + native kernel via the existing model suite).
          replace(
              "apps/predbat/tests/test_infra.py",
              "    inverter_loss=1.0,\n    battery_rate_max_charge=1.0,\n",
              "    inverter_loss=1.0,\n    inverter_freeze_export_discharge_rate=0.0,\n    battery_rate_max_charge=1.0,\n",
          )
          replace(
              "apps/predbat/tests/test_infra.py",
              "    assert_keep=0.0,\n    save=\"best\",\n",
              "    assert_keep=0.0,\n    assert_battery_cycle=None,\n    save=\"best\",\n",
          )
          replace(
              "apps/predbat/tests/test_infra.py",
              "    my_predbat.inverter_loss = inverter_loss\n    my_predbat.battery_rate_max_charge = battery_rate_max_charge / 60.0\n",
              "    my_predbat.inverter_loss = inverter_loss\n"
              "    my_predbat.inverter_freeze_export_discharge_rate = inverter_freeze_export_discharge_rate\n"
              "    my_predbat.battery_rate_max_charge = battery_rate_max_charge / 60.0\n",
          )
          replace(
              "apps/predbat/tests/test_infra.py",
              "    if abs(final_soc - assert_final_soc) >= 0.1:\n        if not ignore_failed:\n            print(\"ERROR: Final SOC {} should be {}\".format(final_soc, assert_final_soc))\n        failed = True\n    if abs(final_iboost - assert_final_iboost) >= 0.1:\n",
              "    if abs(final_soc - assert_final_soc) >= 0.1:\n"
              "        if not ignore_failed:\n"
              "            print(\"ERROR: Final SOC {} should be {}\".format(final_soc, assert_final_soc))\n"
              "        failed = True\n"
              "    if assert_battery_cycle is not None and abs(battery_cycle - assert_battery_cycle) >= 0.001:\n"
              "        if not ignore_failed:\n"
              "            print(\"ERROR: Battery cycle {} should be {}\".format(battery_cycle, assert_battery_cycle))\n"
              "        failed = True\n"
              "    if abs(final_iboost - assert_final_iboost) >= 0.1:\n",
          )

          model_tests = '''    # Freeze Export internal battery discharge regression coverage. 240 W for one hour\n    # is 0.24 kWh. It applies only in Freeze Export, respects reserve, and counts as cycling.\n    failed |= simple_scenario(\n        \"freeze_export_discharge_rate_default_zero\", my_predbat, 0, 0,\n        assert_final_metric=0, assert_final_soc=10.0, battery_size=10.0, battery_soc=10.0,\n        discharge=99, end_record=60, inverter_freeze_export_discharge_rate=0.0, assert_battery_cycle=0.0,\n    )\n    failed |= simple_scenario(\n        \"freeze_export_discharge_rate_240w_one_hour\", my_predbat, 0, 0,\n        assert_final_metric=0, assert_final_soc=9.76, battery_size=10.0, battery_soc=10.0,\n        discharge=99, end_record=60, inverter_freeze_export_discharge_rate=240.0, assert_battery_cycle=0.24,\n    )\n    failed |= simple_scenario(\n        \"freeze_export_discharge_rate_not_outside_freeze\", my_predbat, 0, 0,\n        assert_final_metric=0, assert_final_soc=10.0, battery_size=10.0, battery_soc=10.0,\n        discharge=100, end_record=60, inverter_freeze_export_discharge_rate=240.0, assert_battery_cycle=0.0,\n    )\n    failed |= simple_scenario(\n        \"freeze_export_discharge_rate_reserve_floor\", my_predbat, 0, 0,\n        assert_final_metric=0, assert_final_soc=4.0, battery_size=10.0, battery_soc=4.1, reserve=4.0,\n        discharge=99, end_record=60, inverter_freeze_export_discharge_rate=240.0, assert_battery_cycle=0.1,\n    )\n    if failed:\n        return failed\n\n'''
          replace(
              "apps/predbat/tests/test_model.py",
              "    failed = False\n    failed |= simple_scenario(\"zero\", my_predbat, 0, 0, 0, 0, with_battery=False)\n",
              "    failed = False\n" + model_tests + "    failed |= simple_scenario(\"zero\", my_predbat, 0, 0, 0, 0, with_battery=False)\n",
          )

          replace(
              "apps/predbat/tests/test_kernel_parity.py",
              "    \"inverter_loss\",\n    \"inverter_limit\",\n",
              "    \"inverter_loss\",\n    \"inverter_freeze_export_discharge_rate\",\n    \"inverter_limit\",\n",
          )
          replace(
              "apps/predbat/tests/test_kernel_parity.py",
              "    my_predbat.set_export_freeze = rng.choice([True, False])\n    my_predbat.set_export_freeze_only = rng.choice([True, False, False, False])\n",
              "    my_predbat.set_export_freeze = rng.choice([True, False])\n"
              "    my_predbat.set_export_freeze_only = rng.choice([True, False, False, False])\n"
              "    # Exercise a non-zero value without consuming another RNG draw, preserving seeded scenarios.\n"
              "    my_predbat.inverter_freeze_export_discharge_rate = 240.0 if my_predbat.set_export_freeze else 0.0\n",
          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cross-build all prediction kernels
        run: bash apps/predbat/build_kernel_cross.sh
      - name: Run focused model and kernel parity tests
        env:
          PREDBAT_KERNEL_REQUIRED: "1"
        run: |
          cd coverage
          python3 ../apps/predbat/unit_test.py --test model --test kernel_parity
      - name: Run quick test suite
        env:
          PREDBAT_KERNEL_REQUIRED: "1"
        run: |
          cd coverage
          python3 ../apps/predbat/unit_test.py --quick
      - name: Verify checked-in x86_64 kernel
        run: |
          cd coverage
          python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so
      - name: Commit validated patch and rebuilt kernels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/predbat/predbat.py apps/predbat/prediction.py apps/predbat/prediction_kernel.cpp apps/predbat/prediction_kernel.py apps/predbat/prediction_kernel_lib_*.so apps/predbat/tests/test_infra.py apps/predbat/tests/test_model.py apps/predbat/tests/test_kernel_parity.py
          git commit -m "feat: model Freeze Export battery discharge rate"
          git push origin HEAD:sync-v8.49.2-freeze-discharge-rate
