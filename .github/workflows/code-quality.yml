name: code-quality
on:
  pull_request:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - uses: pre-commit/action@v3.0.0
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
    - name: Build prediction kernel
      run: bash apps/predbat/build_kernel.sh
    - name: Run unit tests (quick mode)
      env:
        PREDBAT_KERNEL_REQUIRED: "1"
      run: |
        cd coverage
        python3 ../apps/predbat/unit_test.py --quick
    - name: Verify checked-in x86_64 kernel binary
      run: |
        cd coverage
        python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so

  # Cross-build the prediction kernel binaries for every platform and commit them
  # back to the PR branch when they change (same auto-fix pattern as pre-commit)
  kernel-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Cross-build prediction kernel binaries
      run: bash apps/predbat/build_kernel_cross.sh
    - name: Commit updated kernel binaries
      run: |
        git add apps/predbat/prediction_kernel_lib_*.so
        if git diff --cached --quiet; then
          echo "Kernel binaries unchanged"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update prediction kernel binaries for all platforms"
          git push
        fi

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/predbat-v9.3.5-modern-ui-20261004'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install locked frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Test frontend including preserved Detailed flow and packaging
      working-directory: frontend
      run: npm test
    - name: Lint frontend
      working-directory: frontend
      run: npm run lint
    - name: Build reproducible production bundle
      working-directory: frontend
      run: npm run bundle
    - name: Verify production archive and patched sanitizer
      run: |
        python3 - <<'PY'
        import zipfile
        with zipfile.ZipFile("apps/predbat/frontend.zip") as archive:
            assert archive.testzip() is None
            assert "dist/index.html" in archive.namelist()
            code = b"".join(archive.read(name) for name in archive.namelist() if name.endswith(".js"))
            assert b"3.4.16" in code
            assert b"3.1.7" not in code
            assert any("OverviewPage" in name for name in archive.namelist())
        PY
    - name: Commit rebuilt bundle to this review branch
      run: |
        git add apps/predbat/frontend.zip
        if git diff --cached --quiet; then
          echo "Frontend bundle unchanged"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "build(frontend): rebuild preserved modern UI with Overview"
          git push
        fi
