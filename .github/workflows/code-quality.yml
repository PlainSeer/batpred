name: code-quality
on:
  pull_request:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - uses: pre-commit/action@v3.0.0
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
    - name: Build prediction kernel
      run: bash apps/predbat/build_kernel.sh
    - name: Run unit tests (quick mode)
      env:
        PREDBAT_KERNEL_REQUIRED: "1"
      run: |
        cd coverage
        python3 ../apps/predbat/unit_test.py --quick
    - name: Verify checked-in x86_64 kernel binary
      run: |
        cd coverage
        python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so

  # Cross-build the prediction kernel binaries for every platform and commit them
  # back to the PR branch when they change (same auto-fix pattern as pre-commit)
  kernel-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
    - name: Apply staged Freeze Export loss patch
      shell: bash
      run: |
        awk '
          /^          from pathlib import Path$/ {flag=1}
          /^          PY$/ {flag=0}
          flag {sub(/^          /, ""); print}
        ' .github/workflows/freeze-export-loss-patch.yml > /tmp/freeze_patch.py
        test -s /tmp/freeze_patch.py
        python3 /tmp/freeze_patch.py
        python3 -m py_compile apps/predbat/predbat.py apps/predbat/prediction.py apps/predbat/prediction_kernel.py
        rm -f .github/workflows/freeze-export-loss-patch.yml
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Cross-build prediction kernel binaries
      run: bash apps/predbat/build_kernel_cross.sh
    - name: Commit Freeze Export patch and kernel binaries
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(prediction): model configurable Freeze Export battery loss"
          git push
        fi
