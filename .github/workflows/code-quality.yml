name: code-quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - main
    - 'review/predbat-v9.6.3-modern-ui-20261030'
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - uses: pre-commit/action@v3.0.0
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
    - name: Build prediction kernel
      run: bash apps/predbat/build_kernel.sh
    - name: Run unit tests (quick mode)
      env:
        PREDBAT_KERNEL_REQUIRED: "1"
      run: |
        cd coverage
        python3 ../apps/predbat/unit_test.py --quick
    - name: Verify checked-in x86_64 kernel binary
      run: |
        cd coverage
        python3 ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so

  # Cross-build the prediction kernel binaries for every platform and commit them
  # back to the PR branch when they change (same auto-fix pattern as pre-commit)
  kernel-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Cross-build prediction kernel binaries
      run: bash apps/predbat/build_kernel_cross.sh
    - name: Commit updated kernel binaries
      run: |
        git add apps/predbat/prediction_kernel_lib_*.so
        if git diff --cached --quiet; then
          echo "Kernel binaries unchanged"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update prediction kernel binaries for all platforms"
          git push
        fi

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Report dependency audit
      working-directory: frontend
      continue-on-error: true
      run: npm audit --json
    - name: Test modern UI and power flow routes
      working-directory: frontend
      run: npm test
    - name: Lint frontend
      working-directory: frontend
      run: npm run lint
    - name: Build production UI
      working-directory: frontend
      run: npm run build
    - name: Verify installed UI files match fresh build
      run: |
        git diff --exit-code -- 'apps/predbat/predbat_ui*'
        untracked=$(git ls-files --others --exclude-standard -- 'apps/predbat/predbat_ui*')
        if [ -n "$untracked" ]; then
          echo "Generated frontend files are missing from Git:"
          echo "$untracked"
          exit 1
        fi
