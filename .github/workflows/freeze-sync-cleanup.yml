name: freeze-sync-cleanup
on:
  pull_request:
    branches: [validation-base-v8.49.2]
permissions:
  contents: write
jobs:
  format-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - name: Format test and remove validation files
        run: |
          python -m pip install black==23.11.0
          black apps/predbat/tests/test_model.py
          rm -f .github/FREEZE_SYNC_NOTE.md .validation-trigger
          rm -f .github/workflows/freeze-discharge-rate-sync.yml
          rm -f .github/workflows/freeze-discharge-rate-validator.yml
          rm -f .github/workflows/freeze-sync-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format Freeze Export tests and remove validation files"
          git push origin HEAD:${{ github.head_ref }}
